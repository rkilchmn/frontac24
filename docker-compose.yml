name: frontaccounting

# Local development stack for FrontAccounting:
#   db    - MariaDB 11.4 (data in the fa-db-data volume, never published)
#   php   - PHP 8.4.10 FPM with the FA extensions
#   nginx - plain HTTP reverse proxy in front of php-fpm
#
#   docker compose up -d --build      start
#   docker compose logs -f php        follow the PHP log
#   make restore FILE=dump.sql        import a production dump
#
# Everything is configured through .env (copy .env.example -> .env).

services:
  db:
    image: mariadb:11.4
    container_name: fa-db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD is missing in .env}
      MARIADB_DATABASE: ${DB_NAME:-frontacc}
      MARIADB_USER: ${DB_USER:-frontacc}
      MARIADB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is missing in .env}
    volumes:
      - fa-db-data:/var/lib/mysql
      - ./docker/mysql/conf.d:/etc/mysql/conf.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    # no public port on purpose, use:
    #   docker compose exec db mariadb -ufrontacc -p frontacc
    # the line below publishes it on localhost only, for a desktop client
    ports:
      - "127.0.0.1:${DB_PORT_HOST:-3307}:3306"

  php:
    build:
      context: ./docker/php
      args:
        PHP_VERSION: ${PHP_VERSION:-8.4.10}
    container_name: fa-php
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      FA_DB_HOST: db
      FA_DB_PORT: "3306"
      FA_DB_USER: ${DB_USER:-frontacc}
      FA_DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is missing in .env}
      FA_DB_NAME: ${DB_NAME:-frontacc}
      FA_DEF_COY: ${FA_DEF_COY:-2}
      FA_TB_PREF_COUNTER: ${FA_TB_PREF_COUNTER:-7}
      FA_COMPANIES: ${FA_COMPANIES:?FA_COMPANIES is missing in .env}
      FA_TIMEZONE: ${FA_TIMEZONE:-Europe/Berlin}
      FA_SECURE_ONLY: ${FA_SECURE_ONLY:-0}
      FA_POOL_USER: ${FA_POOL_USER:-}
      FA_POOL_GROUP: ${FA_POOL_GROUP:-}
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: ${DB_USER:-frontacc}
      PMA_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is missing in .env}
    volumes:
      - ./core:/var/www/html
      - ./docker/generated/config_db.php:/var/www/html/config_db.php
    expose:
      - "9000"

  nginx:
    image: nginx:1.27-alpine
    container_name: fa-nginx
    restart: unless-stopped
    depends_on:
      - php
    ports:
      - "${HTTP_BIND:-127.0.0.1}:${HTTP_PORT:-8080}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./core:/var/www/html:ro
      - phpmyadmin:/usr/share/phpmyadmin:ro

volumes:
  fa-db-data:
    name: fa-db-data
  phpmyadmin: