; FrontAccounting PHP configuration (production sane defaults)

[PHP]
; FA relies on classes being instantiated during session bootstrap
session.auto_start = 0
session.use_trans_sid = 0
session.cookie_httponly = 1
session.gc_maxlifetime = 3600
; /tmp is world writable, so it works for both root and non-root (dev) runs
session.save_path = "/tmp"
session.save_handler = files

memory_limit = 256M
max_execution_time = 300
max_input_time = 300
max_input_vars = 5000

upload_max_filesize = 32M
post_max_size = 40M
file_uploads = On

expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT

; container level tweaks that must not touch the FA source tree
; (currently: the SECURE_ONLY session cookie flag)
auto_prepend_file = /usr/local/etc/fa/fa-prepend.php

; FA does its own logging to core/tmp/errors.log, this is only for PHP notices
date.timezone = UTC

[opcache]
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.max_accelerated_files = 10000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
