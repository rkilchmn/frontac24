; Development only: mounted into php-fpm.d by docker-compose.dev.yml
; (loaded after zz-fa.conf, so it wins).
;
; A worker whose request is paused at an Xdebug breakpoint must not be
; killed mid-debug. Keep this in sync with fastcgi_read_timeout in
; docker/nginx/default.conf (both 10 min) so nginx and php-fpm give up
; at the same time instead of nginx showing a dead upstream.
[www]
request_terminate_timeout = 600s