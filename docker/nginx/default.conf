# FrontAccounting behind nginx.
#
# The upstream .htaccess is not used by nginx, so the equivalent rules are
# repeated here:
#   * deny direct access to .inc / .sql / .log / .po / .sh files
#   * no directory listings
#   * deny the directories where FA keeps generated/cached/backup data

server {
    listen 80;
    server_name _;

    root /var/www/html;
    index index.php;

    charset utf-8;
    client_max_body_size 40m;
    autoindex off;

    # FA generates PDF reports on the fly, give it room
    fastcgi_read_timeout 300s;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    # --- deny the "protected files" rules from core/.htaccess -------------
    location ~* \.(inc|sql|log|po|sh|bak|old|swp)$ {
        deny all;
        access_log off;
        log_not_found off;
        return 404;
    }

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
        return 404;
    }

    # --- deny FA runtime data directories ---------------------------------
    location ^~ /tmp/ {
        deny all;
        access_log off;
        log_not_found off;
        return 404;
    }

    location ~ ^/company/[0-9]+/(backup|reporting|pdf_files)/ {
        deny all;
        access_log off;
        log_not_found off;
        return 404;
    }

    # the install wizard must not be reachable once the app is set up
    # (uncomment to block it, FA's README asks you to remove it as well)
    # location ^~ /install/ {
    #     deny all;
    #     return 404;
    # }

    # --- static files -----------------------------------------------------
    location ~* \.(css|js|gif|jpe?g|png|svg|ico|woff2?|ttf|eot)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # --- the graphql and mcp module endpoints -------------------------------
    # Both modules serve everything under their directory from their own
    # index.php. They ship the rules as .htaccess, which nginx ignores, so
    # they are repeated here. The modules keep the rules in their own
    # nginx/ directory, these are the same ones.
    include /var/www/html/modules/graphql/nginx/graphql.conf;
    include /var/www/html/modules/mcp/nginx/mcp.conf;

    # --- PHP --------------------------------------------------------------
    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param HTTPS $https if_not_empty;
    }

    # --- everything else ---------------------------------------------------
    location / {
        # FA serves real files (access/login.php, gl/journal.php, ...), the
        # front controller is only used for the application root
        try_files $uri $uri/ /index.php?$query_string;
    }
}
